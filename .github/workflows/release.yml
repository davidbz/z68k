name: Release

on:
  push:
    tags:
      - 'v[0-9]+.[0-9]+.[0-9]+'   # semver tags only: v0.1.0, v1.2.3, etc.
  workflow_dispatch:
    inputs:
      tag:
        description: 'Tag to release (must already exist)'
        required: true

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false   # never cancel a release mid-publish

# z68k ships as a Zig package, not a binary: `zig fetch` clones the git tag
# itself, so the tag *is* the release. This workflow only checks the tag is
# honest and puts a release page on it.
jobs:
  release:
    name: Publish release
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write   # Required to create the GitHub release
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ inputs.tag || github.ref_name }}

      - name: Compare tag to package version
        run: |
          tag="${{ inputs.tag || github.ref_name }}"
          tag="${tag#v}"
          zon_version=$(grep -oP '\.version\s*=\s*"\K[^"]+' build.zig.zon)
          if [[ "$tag" != "$zon_version" ]]; then
            echo "Tag v$tag does not match build.zig.zon version $zon_version" >&2
            exit 1
          fi

      - uses: mlugg/setup-zig@d1434d08867e3ee9daa34448df10607b98908d29 # v2
        with:
          version: "0.16.0"

      # A tag can be cut from any commit, so don't trust that CI already
      # covered it. This is the only gate on what consumers will fetch.
      - name: Test
        run: zig build test

      # Uses the built-in gh CLI — no third-party action required.
      # --generate-notes auto-populates the release body from PR/commit history.
      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          tag="${{ inputs.tag || github.ref_name }}"
          gh release create "$tag" \
            --repo "${{ github.repository }}" \
            --title "$tag" \
            --generate-notes
